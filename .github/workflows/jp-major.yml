name: jp-major

on:
  # ⚠️ 2026-09-30: 카부탄이 GitHub 서버의 요청을 막아(요청이 끝없이 실패·시간 초과) 자동 실행을 껐다.
  #    일본 주요 기업 갱신은 회사 PC의 예약 작업이 돌린다 — OPERATIONS.md 참고. 필요하면 Actions 화면에서 수동 실행만 가능.
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: jp-major
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 주요 기업 주가·실적 수집
        run: python fetch_jp_major.py
      - name: 데이터 저장
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/jp/major-data.js
          if ! git diff --cached --quiet; then
            git commit -m "data: 일본 주요 기업 주가·실적 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            for attempt in 1 2 3; do
              git pull --rebase origin main || exit 1
              if git push; then exit 0; fi
            done
            exit 1
          fi
      - name: 사이트 미게시 변경 복구
        env:
          GH_TOKEN: ${{ github.token }}
        run: python publish_pages.py
