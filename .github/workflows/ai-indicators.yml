name: ai-indicators-daily

# 30분마다 전체 소스를 확인하고, 값이 바뀐 지표가 있을 때만 커밋한다(fetch_ai_indicators.py가 변경 없으면 파일을 안 씀).
# 예전엔 소스 발표 시각에 맞춘 예약 6개였지만 GitHub가 예약을 3~5시간씩 늦게 돌려(05:30 예약 → 10:30 실행)
# 한국시간 오후~밤에는 아무것도 수집되지 않았다(2026-09-29 13:48 이후 멈춤). 정각·30분은 몰려서 늦으니 7분·37분에 건다.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "수집기만 골라 실행 (비우면 전체). 예: ornn,cds"
        required: false
        default: ""
permissions:
  contents: write
  pages: write
concurrency:
  group: ai-indicators-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 이번 실행에서 받을 소스 정하기
        id: pick
        env:
          MANUAL: ${{ github.event.inputs.only }}
        run: |
          ONLY=""   # 예약 실행은 항상 전체 확인
          if [ -n "$MANUAL" ]; then ONLY="$MANUAL"; fi
          echo "only=$ONLY" >> "$GITHUB_OUTPUT"
          echo "이번 실행: ${ONLY:-전체}"
      - name: 지표 수집
        run: |
          if [ -n "${{ steps.pick.outputs.only }}" ]; then
            python fetch_ai_indicators.py --only "${{ steps.pick.outputs.only }}"
          else
            python fetch_ai_indicators.py
          fi
      - name: 변경분 커밋
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/ai_indicators.json docs/data/ai_indicators_state.json
          if ! git diff --cached --quiet; then
            git commit -m "data: AI 지표 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST (${{ steps.pick.outputs.only || '전체' }})"
            for attempt in 1 2 3; do
              git pull --rebase origin main || exit 1
              if git push; then exit 0; fi
            done
            exit 1
          fi
      - name: Pages 배포 요청
        env:
          GH_TOKEN: ${{ github.token }}
        run: python publish_pages.py
