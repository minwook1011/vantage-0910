name: ai-indicators-daily
on:
  schedule:
    # KST 07:00 — OpenRouter 주간 집계, 전날 미국 종가, 대만 월매출(10일경)이 모두 반영된 뒤.
    # 캐팩스·AI 랩 매출 보도는 매일 확인하고, 새 값이 있을 때만 파일이 바뀐다.
    - cron: "0 22 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: ai-indicators-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect AI indicators
        run: python fetch_ai_indicators.py
      - name: Commit changed data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/ai_indicators.json docs/data/ai_indicators_state.json
          if ! git diff --cached --quiet; then
            git commit -m "data: AI 인프라 지표 $(TZ=Asia/Seoul date +'%Y-%m-%d') 갱신"
            for attempt in 1 2 3; do
              git pull --rebase origin main || exit 1
              if git push; then exit 0; fi
            done
            exit 1
          fi
      - name: Request Pages publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python publish_pages.py
