name: ai-indicators-daily

# 소스마다 발표 시각이 달라서 예약을 나눠 둔다 (cron 은 UTC, 괄호는 한국시간).
#   20:30 UTC (05:30 KST)  Ornn 렌탈 지수 — 미국 동부 16:00 정산 직후
#   23:00 UTC (08:00 KST)  ICE Clear Credit CDS 결제가격 — 미국 장 마감 후 공시 (평일)
#   00:00 UTC (09:00 KST)  OpenRouter 토큰·단가·모델·앱·가격인하·프론티어 + HF·AI랩 뉴스·주가
#   21:00 UTC 월 (06:00 KST 화)  GetDeploying 주간 GPU 공시가 (월요일 기준 갱신)
#   09:00 UTC 10~16일 (18:00 KST)  대만 증권거래소 월매출 (매월 10일경 공시)
#   22:00 UTC (07:00 KST)  전체 점검 — 캐팩스·TSMC CAPA·TRASS 연결 등 나머지
on:
  schedule:
    - cron: "30 20 * * *"
    - cron: "0 23 * * 1-5"
    - cron: "0 0 * * *"
    - cron: "0 21 * * 1"
    - cron: "0 9 10-16 * *"
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "수집기만 골라 실행 (비우면 전체). 예: ornn,cds"
        required: false
        default: ""
permissions:
  contents: write
  pages: write
concurrency:
  group: ai-indicators-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 이번 실행에서 받을 소스 정하기
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL: ${{ github.event.inputs.only }}
        run: |
          case "$SCHEDULE" in
            "30 20 * * *")    ONLY="ornn" ;;
            "0 23 * * 1-5")   ONLY="cds" ;;
            "0 0 * * *")      ONLY="or_models,or_chart,or_week,or_apps,frontier,hf,arr,prices,gpu" ;;
            "0 21 * * 1")     ONLY="gpu_hist,gpu" ;;
            "0 9 10-16 * *")  ONLY="tsmc" ;;
            *)                ONLY="" ;;
          esac
          if [ -n "$MANUAL" ]; then ONLY="$MANUAL"; fi
          echo "only=$ONLY" >> "$GITHUB_OUTPUT"
          echo "이번 실행: ${ONLY:-전체}"
      - name: 지표 수집
        run: |
          if [ -n "${{ steps.pick.outputs.only }}" ]; then
            python fetch_ai_indicators.py --only "${{ steps.pick.outputs.only }}"
          else
            python fetch_ai_indicators.py
          fi
      - name: 변경분 커밋
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/ai_indicators.json docs/data/ai_indicators_state.json
          if ! git diff --cached --quiet; then
            git commit -m "data: AI 지표 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST (${{ steps.pick.outputs.only || '전체' }})"
            for attempt in 1 2 3; do
              git pull --rebase origin main || exit 1
              if git push; then exit 0; fi
            done
            exit 1
          fi
      - name: Pages 배포 요청
        env:
          GH_TOKEN: ${{ github.token }}
        run: python publish_pages.py
