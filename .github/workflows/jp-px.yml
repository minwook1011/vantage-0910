name: jp-px

on:
  schedule:
    - cron: "40 7 * * 1-5"  # 16:40 KST(평일) 도쿄 장 마감 후 — 일본 기업 스크리너 주가 이어 붙이기 + 실적 리포트 주가·구글 트렌드
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - fetch_jp_px.py
      - .github/workflows/jp-px.yml

permissions:
  contents: write
  pages: write

concurrency:
  group: jp-px
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q trendspy
      - name: 일본 주가·트렌드 수집
        run: python fetch_jp_px.py
      - name: 데이터 저장
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/jp/px_recent.json docs/data/jp/px docs/data/jp/trends
          if ! git diff --cached --quiet; then
            git commit -m "data: 일본 주가·트렌드 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            for attempt in 1 2 3; do
              git pull --rebase origin main || exit 1
              if git push; then exit 0; fi
            done
            exit 1
          fi
      - name: 사이트 미게시 변경 복구
        env:
          GH_TOKEN: ${{ github.token }}
        run: python publish_pages.py
