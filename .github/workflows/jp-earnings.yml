name: jp-earnings-dates

on:
  schedule:
    - cron: "0 0 * * 0"  # 09:00 KST(일) 연중: 발표일 갱신 + 전 종목 실적 스캔(소비재 + 주요 기업)
    # 실적 시즌(1·2·4·5·7·8·10·11월) 평일: 일본 발표 시각에 맞춰 바로 수집(JST=KST)
    #   11:30·13:00 점심 발표 → 11:45·13:15 / 장 마감 15:00~15:30 발표(대부분) → 15:45·16:20 / 16:00~17:00 발표 → 17:00·19:00
    #   그날 카부탄 '決算' 개시 목록에서 결산단신을 낸 종목만 골라 받는다(이미 받은 발표는 건너뜀)
    - cron: "45 2 * 1,2,4,5,7,8,10,11 1-5"
    - cron: "15 4 * 1,2,4,5,7,8,10,11 1-5"
    - cron: "45 6 * 1,2,4,5,7,8,10,11 1-5"
    - cron: "20 7 * 1,2,4,5,7,8,10,11 1-5"
    - cron: "0 8 * 1,2,4,5,7,8,10,11 1-5"
    - cron: "0 10 * 1,2,4,5,7,8,10,11 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - fetch_jp_earnings_dates.py
      - fetch_jp_earnings_results.py
      - .github/workflows/jp-earnings.yml
      - docs/data/jp/major-data.js     # 주요 기업 명단이 바뀌면 전체 다시 스캔(새 종목 실적·리포트)

permissions:
  contents: write
  pages: write

concurrency:
  group: jp-earnings-dates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # 발표 시간대 실행이 앞 실행 뒤에 줄 서도록(동시 실행 금지)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 실적 발표일 수집(느림 — 일요일·수동 실행 때만)
        if: github.event_name != 'schedule' || github.event.schedule == '0 0 * * 0'
        run: python fetch_jp_earnings_dates.py
      - name: 발표 결과·가이던스 대비·주가 반응·실적 리포트(원문 링크)
        continue-on-error: true
        run: python fetch_jp_earnings_results.py ${{ (github.event_name == 'schedule' && github.event.schedule != '0 0 * * 0') && ' ' || '--full' }}
      - name: 데이터 저장
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/jp/earnings_dates.json docs/data/jp/earnings_results.json docs/data/jp/earnings_guidance.json docs/data/jp/reports
          if ! git diff --cached --quiet; then
            git commit -m "data: 일본 기업 실적 발표일·발표 결과·리포트 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            for attempt in 1 2 3; do
              git pull --rebase origin main || exit 1
              if git push; then exit 0; fi
            done
            exit 1
          fi
      - name: 사이트 미게시 변경 복구
        env:
          GH_TOKEN: ${{ github.token }}
        run: python publish_pages.py
