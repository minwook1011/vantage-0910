name: jp-earnings-dates

on:
  # ⚠️ 2026-09-30: 카부탄이 GitHub 서버의 요청을 막아(요청이 끝없이 실패·시간 초과) 자동 실행을 껐다.
  #    일본 실적 수집은 회사 PC의 예약 작업이 돌린다 — OPERATIONS.md 참고. 필요하면 Actions 화면에서 수동 실행만 가능.
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: jp-earnings-dates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # 발표 시간대 실행이 앞 실행 뒤에 줄 서도록(동시 실행 금지)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 실적 발표일 수집(느림 — 일요일·수동 실행 때만)
        if: github.event_name != 'schedule' || github.event.schedule == '0 0 * * 0'
        run: python fetch_jp_earnings_dates.py
      - name: 발표 결과·가이던스 대비·주가 반응·실적 리포트(원문 링크)
        continue-on-error: true
        run: python fetch_jp_earnings_results.py ${{ (github.event_name == 'schedule' && github.event.schedule != '0 0 * * 0') && ' ' || '--full' }}
      - name: 데이터 저장
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/jp/earnings_dates.json docs/data/jp/earnings_results.json docs/data/jp/earnings_guidance.json docs/data/jp/reports
          if ! git diff --cached --quiet; then
            git commit -m "data: 일본 기업 실적 발표일·발표 결과·리포트 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            for attempt in 1 2 3; do
              git pull --rebase origin main || exit 1
              if git push; then exit 0; fi
            done
            exit 1
          fi
      - name: 사이트 미게시 변경 복구
        env:
          GH_TOKEN: ${{ github.token }}
        run: python publish_pages.py
