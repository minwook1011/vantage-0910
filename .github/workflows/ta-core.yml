name: ta-core

# 기술적 분석(신고가·거래량·상대강도) — 2026-10-16 개편. 시장별로 장 마감 뒤 한 번씩.
on:
  schedule:
    - cron: "20 21 * * 0-4"  # 06:20 KST(화~토) 미국 장 마감 후 — 미국
    - cron: "5 7 * * 1-5"    # 16:05 KST(평일) 한국·일본 장 마감 후 — 한국·일본
  workflow_dispatch:
    inputs:
      market:
        description: "us | kr | jp (비우면 셋 다)"
        required: false
  push:
    branches: [main]
    paths:
      - fetch_ta_core.py
      - .github/workflows/ta-core.yml

permissions:
  contents: write
  pages: write

concurrency:
  group: ta-core
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 시장 고르기
        id: pick
        run: |
          M="${{ github.event.inputs.market }}"
          if [ -z "$M" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "20 21 * * 0-4" ]; then M="us"; else M="kr jp"; fi
          fi
          echo "markets=${M:-us kr jp}" >> "$GITHUB_OUTPUT"
      - name: 신고가·거래량·상대강도 수집
        run: |
          for m in ${{ steps.pick.outputs.markets }}; do python fetch_ta_core.py --market "$m"; done
      - name: 데이터 저장
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/ta
          if ! git diff --cached --quiet; then
            git commit -m "data: 기술적 분석(신고가·거래량·상대강도) ${{ steps.pick.outputs.markets }} $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main || exit 1
              if git push; then exit 0; fi
            done
            exit 1
          fi
      - name: 사이트 미게시 변경 복구
        env:
          GH_TOKEN: ${{ github.token }}
        run: python publish_pages.py
