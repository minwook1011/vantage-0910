name: kr-companies-update

on:
  schedule:
    - cron: "40 7 * * 1-5"   # 16:40 KST 장 마감 후 주가·실적 갱신
    - cron: "10 23 * * 0-4"  # 08:10 KST 전일 공시·컨센서스 반영
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - fetch_kr_companies.py
      - data_sources/kr_universe.json
      - data_sources/kr_financials/**
      - .github/workflows/kr-companies.yml

permissions:
  contents: write
  pages: write

concurrency:
  group: kr-companies-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 한국 기업 주가·실적 갱신
        run: python fetch_kr_companies.py
      - name: 데이터 저장
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/kr docs/data/kr_companies.json
          if ! git diff --cached --quiet; then
            git commit -m "data: 한국 기업 주가·실적 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            for attempt in 1 2 3; do
              git pull --rebase origin main || exit 1
              if git push; then exit 0; fi
            done
            exit 1
          fi
      - name: 사이트 미게시 변경 복구
        env:
          GH_TOKEN: ${{ github.token }}
        run: python publish_pages.py
