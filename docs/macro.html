<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="firebase-sync.js?v=20260920a"></script>
<script src="gate.js?v=20260909a"></script>
<title>매크로 및 투자전략 — VANTAGE</title>
<link rel="stylesheet" href="theme.css?v=20260909b">
<link rel="stylesheet" href="macro-dash.css?v=20260921b">
</head>
<body>
<header id="topnav"></header>
<main class="container mx-page">
  <header class="mx-top">
    <div>
      <div class="mx-eyebrow"><span class="mx-live"></span>MACRO TERMINAL</div>
      <h1>매크로 대시보드</h1>
      <p>미국 물가·고용·성장·금리와 한·미 지수. 발표 직후 자동 갱신 · 모든 시각 <b>한국시간</b></p>
    </div>
    <div class="mx-stamp" id="mx-updated"></div>
  </header>

  <section class="mx-regime" id="mx-regime" aria-label="매크로 국면"></section>

  <section class="mx-block" aria-label="경제 캘린더">
    <div class="mx-block-h"><div><span class="mx-k">ECONOMIC CALENDAR</span><h2>경제 캘린더</h2></div>
      <div class="mx-legend-cat" id="mx-cat-legend"></div></div>
    <div class="mx-cal-wrap">
      <div class="mx-panel mx-month">
        <div class="mx-month-h"><button class="mx-nav" id="mx-prev" aria-label="이전 달">‹</button><b id="mx-month-title"></b><button class="mx-nav" id="mx-next-m" aria-label="다음 달">›</button><button class="mx-today" id="mx-go-today">오늘</button></div>
        <div class="mx-dow"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span></div>
        <div class="mx-grid" id="mx-grid"></div>
      </div>
      <aside class="mx-side" id="mx-side"></aside>
    </div>
    <div class="mx-drawer" id="mx-drawer"><div class="mx-drawer-in"><div id="mx-drawer-body"></div></div></div>
  </section>

  <section class="mx-block" aria-label="지표 보드">
    <div class="mx-block-h"><div><span class="mx-k">INDICATOR BOARD</span><h2>핵심 지표</h2></div><span class="mx-hint">행을 누르면 장기 차트와 통계가 펼쳐집니다</span></div>
    <div class="mx-boards" id="mx-boards"></div>
  </section>

  <section class="mx-block" aria-label="차트 탐색기">
    <div class="mx-block-h"><div><span class="mx-k">MARKETS × MACRO</span><h2>지수와 매크로 겹쳐보기</h2></div><span class="mx-hint">타일을 눌러 지수를 켜고 끕니다</span></div>
    <div class="mx-tiles" id="mx-tiles"></div>
    <div class="mx-panel mx-explorer">
      <div class="mx-toolbar">
        <div class="mx-tb-group"><span class="mx-lbl">오버레이</span><select id="mx-overlay"></select></div>
        <div class="mx-tb-group"><div class="mx-seg" id="mx-mode"></div></div>
        <div class="mx-tb-group"><div class="mx-seg" id="mx-range"></div></div>
        <label class="mx-check"><input type="checkbox" id="mx-events" checked> 발표일</label>
      </div>
      <div class="mx-chart" id="mx-chart"></div>
      <div class="mx-legend" id="mx-legend"></div>
    </div>
  </section>

  <section class="mx-block" aria-label="미국 국채 금리">
    <div class="mx-block-h"><div><span class="mx-k">US TREASURIES</span><h2>미국 국채 금리</h2></div><span class="mx-hint" id="mx-rates-sub"></span></div>
    <div class="mx-ytiles" id="mx-ytiles"></div>
    <div class="mx-rates">
      <div class="mx-panel"><div class="mx-panel-h"><b>수익률 곡선</b><span>지금 · 1개월 전 · 1년 전</span></div><div id="mx-curve"></div></div>
      <div class="mx-panel"><div class="mx-panel-h"><b>장단기 금리차</b><div class="mx-seg" id="mx-spread-t"></div></div><div id="mx-spread"></div></div>
    </div>
  </section>

  <p class="mx-foot" id="mx-foot"></p>
</main>
<script src="theme.js?v=20260921a"></script>
<script src="macro-dash.js?v=20260921b"></script>
</body>
</html>
