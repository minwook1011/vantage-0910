<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="firebase-sync.js?v=20260920a"></script>
<script src="gate.js?v=20260909a"></script>
<meta name="theme-color" content="#070a11">
<title>Coverage — VANTAGE</title>
<link rel="stylesheet" href="theme.css?v=20260909b">
<link rel="stylesheet" href="coverage.css?v=20260912a">
</head>
<body>
<header id="topnav"></header>
<main class="container coverage-page">
  <header class="coverage-head">
    <div>
      <div class="kicker">RESEARCH COVERAGE</div>
      <h1>중요한 변화만,<br><span>내 관심 범위 안에서.</span></h1>
      <p>기업·섹터·주제를 등록하면 분석 자료를 모아 네 줄로 압축합니다.</p>
    </div>
    <div class="coverage-pulse" aria-label="수집 상태">
      <i></i><div><b>COLLECTOR READY</b><span>다음 브리핑 · 12:00 KST</span></div>
    </div>
  </header>

  <section class="coverage-console" aria-labelledby="console-title">
    <div class="console-label"><span id="console-title">ADD TO COVERAGE</span><span>기업 · 섹터 · 주제</span></div>
    <form id="coverage-form" class="coverage-form">
      <div class="type-switch" role="group" aria-label="커버리지 유형">
        <button type="button" class="on" data-type="기업">기업</button>
        <button type="button" data-type="섹터">섹터</button>
        <button type="button" data-type="주제">주제</button>
      </div>
      <label class="coverage-input-wrap" for="coverage-input">
        <span class="search-mark">⌕</span>
        <input id="coverage-input" autocomplete="off" placeholder="예: SK하이닉스, 전력기기, AI 데이터센터">
        <span class="enter-hint">ENTER</span>
      </label>
      <button class="coverage-add" type="submit">추적 시작 <span>↗</span></button>
    </form>
    <div class="coverage-suggestions" aria-label="빠른 등록">
      <span>QUICK ADD</span>
      <button type="button" data-type="기업" data-name="SK하이닉스">SK하이닉스</button>
      <button type="button" data-type="섹터" data-name="HBM">HBM</button>
      <button type="button" data-type="섹터" data-name="조선·엔진">조선·엔진</button>
      <button type="button" data-type="주제" data-name="AI 데이터센터 전력">AI 데이터센터 전력</button>
    </div>
  </section>

  <div class="coverage-layout">
    <aside class="coverage-sidebar">
      <div class="side-head"><span>MY COVERAGE</span><b id="watch-count">0</b></div>
      <div id="watch-list" class="watch-list"></div>
      <div class="delivery-card">
        <div class="delivery-top"><span>TELEGRAM DELIVERY</span><i></i></div>
        <b>한 번에 길게 받기</b>
        <p>평일 08 · 12 · 16 · 22시<br>주말 12시</p>
      </div>
    </aside>

    <section class="research-stream" aria-labelledby="stream-title">
      <div class="stream-head">
        <div><span class="stream-kicker">LATEST RESEARCH</span><h2 id="stream-title">커버리지 브리핑</h2></div>
        <div class="stream-meta"><span id="result-count">0 REPORTS</span><span id="sync-time">SYNC —</span></div>
      </div>
      <div class="stream-controls">
        <div class="filter-tabs" role="group" aria-label="자료 필터">
          <button type="button" class="on" data-filter="전체">전체</button>
          <button type="button" data-filter="기업">기업</button>
          <button type="button" data-filter="섹터">섹터</button>
          <button type="button" data-filter="주제">주제</button>
        </div>
        <label class="fresh-toggle"><input type="checkbox" id="fresh-only"><span></span>새 글만</label>
      </div>
      <div id="research-list" class="research-list" aria-live="polite"></div>
    </section>
  </div>
</main>
<div id="toast" class="coverage-toast" role="status" aria-live="polite"></div>
<script src="theme.js?v=20260921a"></script>
<script src="coverage.js?v=20260912a"></script>
</body>
</html>
