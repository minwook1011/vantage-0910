<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="firebase-sync.js?v=20260915a"></script>
<script src="gate.js?v=20260909a"></script>
<title>Bottom-up 종목 발굴 — VANTAGE</title>
<link rel="stylesheet" href="theme.css?v=20260909b">
<style>
.bu-controls-wrap { position: sticky; top: 86px; z-index: 45; margin: 18px -16px 0; padding: 11px 16px 12px; background: rgba(11,14,20,.94); backdrop-filter: blur(13px); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); box-shadow: 0 9px 20px rgba(0,0,0,.12); }
.bu-controls { display: flex; justify-content: space-between; align-items: center; gap: 9px 18px; flex-wrap: wrap; max-width: 1280px; margin: 0 auto; }.uni-wrap { display: flex; align-items: center; gap: 8px; }.uni-wrap .lbl { color: var(--muted); font-size: 11.5px; white-space: nowrap; }.finance-controls { display: contents; }
.bu-rank-tk { display:flex; align-items:baseline; gap:6px; }.bu-rank-tk .rk-no { color:var(--accent); font-weight:800; font-family:var(--mono); }.wip-banner { font-size:12.5px; color:var(--muted); background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:9px 12px; margin:10px 0 4px; line-height:1.65; }.wip-banner b { color:var(--text); }.wip-banner[hidden] { display:none; }
.bu-table-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--card); }.bu-table { width:100%; min-width:880px; border-collapse:collapse; }.bu-table th { padding:10px 11px; color:var(--muted); background:var(--bg2); font:700 11.5px var(--mono); text-align:right; white-space:nowrap; }.bu-table thead th { position:sticky; top:calc(86px + var(--bu-controls-h, 100px)); z-index:24; border-bottom:1px solid var(--border-strong); box-shadow:0 6px 10px rgba(0,0,0,.22); }.bu-table th.left { text-align:left; }.bu-table td { padding:10px 11px; border-top:1px solid var(--border); text-align:right; white-space:nowrap; font-family:var(--mono); font-size:12px; }.bu-table tr.bu-main-row { cursor:pointer; transition:background .16s ease; }.bu-table tr.bu-main-row:hover { background:var(--card-hover); }.bu-table .rank { color:var(--faint); text-align:left; }.bu-table .ticker { font-size:12px; color:var(--muted); }.bu-table .name { text-align:left; font-family:var(--sans); font-size:13px; font-weight:750; color:var(--text); }.bu-table .sector { text-align:left; font-family:var(--sans); color:var(--muted); }.bu-fin-row td { padding:0 11px 12px 42px; background:rgba(0,0,0,.09); }.bu-fin-line { display:flex; align-items:stretch; gap:6px; min-width:720px; border-left:2px solid var(--border-strong); padding-left:10px; }.bu-fin-label { display:flex; flex:0 0 156px; flex-direction:column; justify-content:center; color:var(--muted); font-family:var(--sans); font-size:11px; line-height:1.45; }.bu-fin-label b { color:var(--text); font-size:12px; }.bu-fin-values { display:grid; grid-template-columns:repeat(6, minmax(86px,1fr)); flex:1; gap:5px; }.fin-cell { position:relative; min-height:48px; overflow:hidden; padding:6px 7px; border:1px solid var(--border); border-radius:6px; background:var(--bg2); text-align:left; }.fin-cell::before { content:""; position:absolute; inset:0; transform:scaleX(0); transform-origin:left; background:var(--heat); opacity:.78; transition:transform .72s cubic-bezier(.16,1,.3,1); transition-delay:var(--delay,0ms); }.fin-cell.is-visible::before { transform:scaleX(1); }.fin-cell > * { position:relative; z-index:1; }.fin-period { display:block; color:var(--muted); font-size:9.5px; }.fin-value { display:block; margin-top:2px; color:var(--text); font-weight:750; font-size:11.5px; }.fin-yoy { display:block; margin-top:1px; color:#cbd8f7; font-size:10px; }.fin-empty { color:var(--faint); font:11px var(--sans); }
.bu-heat { position:relative; display:block; overflow:hidden; margin:-10px -11px; padding:10px 11px; }.bu-heat::before { content:""; position:absolute; inset:0; transform:scaleX(0); transform-origin:left; background:var(--heat); opacity:.76; transition:transform .68s cubic-bezier(.16,1,.3,1); transition-delay:var(--delay,0ms); }.bu-heat.is-visible::before { transform:scaleX(1); }.bu-heat span { position:relative; z-index:1; }.bu-heat.pos span { color:#ff7a8c; }.bu-heat.neg span { color:#76a4ff; }
.more-btn { margin-top:12px; background:var(--card); border:1px solid var(--border); color:var(--muted); border-radius:8px; padding:7px 16px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit; }.more-btn:hover { border-color:var(--accent); color:var(--text); }
/* 한 기업의 시세 행 + 재무 행이 끝나는 곳을 명확히 분리 */
.bu-table tbody .bu-main-row td { border-top:2px solid #3a4660; }.bu-table tbody .bu-main-row:first-child td { border-top:1px solid var(--border); }.bu-table .bu-fin-row td { padding-bottom:16px; border-bottom:2px solid #3a4660; }
@media (max-width:720px) { .bu-controls-wrap { top:86px; margin-left:-10px; margin-right:-10px; padding-left:10px; padding-right:10px; }.bu-controls { align-items:flex-start; }.finance-controls { display:flex; gap:9px; width:100%; }.bu-fin-row td { padding-left:17px; }.bu-fin-label { flex-basis:126px; } }
</style>
</head>
<body>
<header id="topnav"></header>
<div class="container">
  <div class="kicker">Bottom-up 접근 · 종목 발굴</div>
  <div class="page-head"><h1>Bottom-up 종목 발굴</h1><span class="upd" id="updated"></span></div>
  <p class="note">개별 종목의 <b>수익률·재무 흐름·기술 신호</b>를 한 화면에서 비교합니다. 수익률순에서는 종목 아래에 최근 6개 연간·분기 재무를 펼쳐 보며, 종목을 클릭하면 차트와 상세 분석이 열립니다.</p>
  <div class="wip-banner" id="wip-banner" hidden>📊 <b>기술점수</b> = 이동평균선·거래량·이평선 지지·RSI·MACD·볼린저·일목균형표·삼각수렴/돌파를 0~100점으로 가중합한 참고 지표입니다.</div>
</div>
<div class="bu-controls-wrap">
  <div class="bu-controls">
    <div class="uni-wrap"><span class="lbl">정렬</span><div class="toggle" id="sort-toggle"></div></div>
    <div class="uni-wrap"><span class="lbl">기간(수익률순)</span><div class="toggle" id="period-toggle"></div></div>
    <div class="uni-wrap"><span class="lbl">범위</span><div class="toggle" id="universe-toggle"></div></div>
    <div class="finance-controls" id="finance-controls">
      <div class="uni-wrap"><span class="lbl">재무 기간</span><div class="toggle" id="fin-period-toggle"></div></div>
      <div class="uni-wrap"><span class="lbl">재무 항목</span><div class="toggle" id="fin-metric-toggle"></div></div>
    </div>
  </div>
</div>
<div class="container">
  <div class="section"><h2>흐름 강한 종목 순위<span class="sub" id="bu-sub"></span></h2><div id="bottomup-content"><div class="spin">로딩 중…</div></div><button class="more-btn" id="bu-more" style="display:none">더 보기</button></div>
</div>
<div class="modal-back" id="modal-back-holder" style="display:none"></div>
<script src="theme.js?v=20260910a"></script>
<script src="stocks-common.js?v=20260912d"></script>
<script>
var DATA = null, PROFILES = {}, FIN = {}, TA = {};
var PERIODS = [["1W","r1w"],["1M","r1m"],["3M","r3m"],["YTD","ytd"]], curPeriod = "r1m";
var SORTS = [["수익률순","ret"],["기술점수순","ta"]], sortMode = "ret";
var FIN_PERIODS = [["연간","annual"],["분기","quarterly"]], finPeriod = "annual";
var FIN_METRICS = [["매출","rev","rev_yoy"],["영업이익","op","op_yoy"]], finMetric = "rev";
var UNIVERSES = [100,300], universeN = 300, SHOWN = 30;
try { var savedN = parseInt(localStorage.getItem("megacapN"),10); if (UNIVERSES.indexOf(savedN) >= 0) universeN = savedN; } catch (e) {}
function inScope(s) { return s.rank == null || s.rank <= universeN; } function scoped() { return (DATA.stocks || []).filter(inScope); }
function syncTableHeaderOffset() { var controls = $q(".bu-controls-wrap"); if (controls) document.documentElement.style.setProperty("--bu-controls-h", controls.offsetHeight + "px"); }
window.addEventListener("resize", syncTableHeaderOffset);
function ccyOf(ticker) { return /\.K[SQ]$/.test(ticker) ? "₩" : /\.(T|TW|HK|NS|SR|L|PA|DE|AS|SW|MI|MC|ST|OL|CO)$/.test(ticker) ? "" : "$"; }
function taOf(s) { if (!(s.ticker in TA)) TA[s.ticker] = computeTA(s.candles); return TA[s.ticker]; } function taScore(s) { var t = taOf(s); return t ? t.score : -1; }
function toggleHTML(items, selected, key) { return items.map(function (x) { return '<button data-' + key + '="' + x[1] + '" class="' + (x[1] === selected ? "on" : "") + '">' + x[0] + "</button>"; }).join(""); }
function renderToggle() {
  $q("#sort-toggle").innerHTML = toggleHTML(SORTS, sortMode, "s"); $qa("#sort-toggle button").forEach(function(b){ b.onclick=function(){sortMode=b.dataset.s;SHOWN=30;renderToggle();renderBottomUp();}; });
  $q("#period-toggle").innerHTML = toggleHTML(PERIODS, curPeriod, "k"); $qa("#period-toggle button").forEach(function(b){ b.onclick=function(){curPeriod=b.dataset.k;SHOWN=30;renderToggle();renderBottomUp();}; });
  $q("#universe-toggle").innerHTML = UNIVERSES.map(function(n){return '<button data-n="'+n+'" class="'+(n===universeN?"on":"")+'">TOP '+n+"</button>";}).join(""); $qa("#universe-toggle button").forEach(function(b){b.onclick=function(){universeN=+b.dataset.n;try{localStorage.setItem("megacapN",universeN);}catch(e){}SHOWN=30;renderToggle();renderBottomUp();};});
  $q("#fin-period-toggle").innerHTML = toggleHTML(FIN_PERIODS, finPeriod, "fp"); $qa("#fin-period-toggle button").forEach(function(b){b.onclick=function(){finPeriod=b.dataset.fp;renderToggle();renderBottomUp();};});
  $q("#fin-metric-toggle").innerHTML = toggleHTML(FIN_METRICS, finMetric, "fm"); $qa("#fin-metric-toggle button").forEach(function(b){b.onclick=function(){finMetric=b.dataset.fm;renderToggle();renderBottomUp();};});
  $q("#finance-controls").style.display = sortMode === "ret" ? "contents" : "none"; $q("#wip-banner").hidden = sortMode !== "ta";
}
function heat(v) { var n = Math.min(.58, .10 + Math.min(Math.abs(num(v)),80) / 80 * .48); return num(v) >= 0 ? "rgba(240,71,90,"+n+")" : "rgba(61,126,255,"+n+")"; }
function finValue(v, ccy) { if (v == null || !isFinite(v)) return "–"; var a=Math.abs(v), sign=v<0?"−":""; if(a>=1000000)return sign+(a/1000000).toFixed(2)+"T"; if(a>=1000)return sign+(a/1000).toFixed(a>=100000?0:1)+"B"; return sign+a.toFixed(a>=100?0:1)+"M"; }
function returnCell(value, delay) { var c=num(value)>=0?"pos":"neg"; return '<div class="bu-heat '+c+' reveal-fill" style="--heat:'+heat(value)+';--delay:'+delay+'ms"><span>'+fmtPct(value)+"</span></div>"; }
function finHistory(s, rank) { var f=FIN[s.ticker], metric=FIN_METRICS.filter(function(x){return x[1]===finMetric;})[0], label=metric[0], yoyKey=metric[2], limit=finPeriod==="annual"?5:8; var rows=f && f[finPeriod] ? f[finPeriod].slice(-limit).reverse() : [];
  var cells=[]; for(var i=0;i<limit;i++){var r=rows[i]; if(!r){cells.push('<div class="fin-cell"><span class="fin-empty">데이터 없음</span></div>');continue;} var yoy=r[yoyKey], ytext=yoy==null?"YoY –":"YoY "+fmtPct(yoy); cells.push('<div class="fin-cell reveal-fill" style="--heat:'+heat(yoy)+';--delay:'+(i*38+rank%7*17)+'ms"><span class="fin-period">'+(i+1)+(finPeriod==="annual"?"Y":"Q")+'</span><b class="fin-value">'+finValue(r[finMetric],r.ccy)+'</b><span class="fin-yoy">'+ytext+'</span></div>');}
  var ccy=rows[0]&&rows[0].ccy?" · "+rows[0].ccy:""; return '<tr class="bu-fin-row"><td colspan="10"><div class="bu-fin-line"><div class="bu-fin-label"><b>'+escapeHtml(s.name)+' · '+label+'</b><span>'+ (finPeriod==="annual"?"최근 연간 5개":"최근 분기 8개")+ccy+'</span></div><div class="bu-fin-values">'+cells.join("")+"</div></div></td></tr>";
}
function returnTable(all) { var shown=all.slice(0,SHOWN); var rows=shown.map(function(s,i){return '<tr class="bu-main-row" data-t="'+s.ticker+'"><td class="rank">'+(i+1)+'</td><td class="ticker">'+s.ticker.replace(/\.[A-Z]+$/,"")+'</td><td class="name">'+escapeHtml(s.name)+'</td><td class="sector">'+escapeHtml(s.sector)+'</td><td>'+fmtMcap(s.mcap_usd)+'</td><td>'+returnCell(s.r1w,(i%9)*24)+'</td><td>'+returnCell(s.r1m,(i%9)*24+36)+'</td><td>'+returnCell(s.r3m,(i%9)*24+72)+'</td><td>'+returnCell(s.ytd,(i%9)*24+108)+'</td><td>'+fmtPrice(s.price,ccyOf(s.ticker))+'</td></tr>'+finHistory(s,i);}).join("");
  return '<div class="bu-table-wrap"><table class="bu-table"><thead><tr><th class="left">#</th><th class="left">티커</th><th class="left">이름</th><th class="left">섹터</th><th>시총</th><th>1W</th><th>1M</th><th>3M</th><th>YTD</th><th>가격</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function bottomUpCard(s,rank){var t=taOf(s),score=t?t.score:null;return '<div class="stock-card'+(rank===1?" lead":"")+'" data-t="'+s.ticker+'"><div class="sc-top"><span class="sc-nm">'+escapeHtml(s.name)+'</span><span class="sc-today" style="color:'+(score==null?"var(--muted)":taScoreColor(score))+'">'+(score==null?"–":score+"점")+'</span></div><div class="sc-tk bu-rank-tk"><span class="rk-no">'+rank+'위</span> '+s.ticker.replace(/\.[A-Z]+$/,"")+" · "+escapeHtml(s.sector)+'</div>'+sparklineSVG(s.spark,130,32)+'<div class="tscore">'+(t?'<span class="tsc-n" style="color:'+taScoreColor(score)+'">'+score+'</span><div class="tsc-bar"><div class="tsc-fill" style="width:'+score+'%;background:'+taScoreColor(score)+'"></div></div>':'<span class="muted small">기술점수 계산불가</span>')+'</div><div class="sc-sub" style="margin-top:5px">'+fmtPrice(s.price,ccyOf(s.ticker))+' <span class="'+pctClass(s.r1d)+'">'+fmtPct(s.r1d)+'</span></div></div>';}
function activateFills(){var els=$qa(".reveal-fill"); if(!("IntersectionObserver" in window)){els.forEach(function(x){x.classList.add("is-visible");});return;} var io=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add("is-visible");io.unobserve(e.target);}});},{threshold:.12});els.forEach(function(x){io.observe(x);});}
function renderBottomUp(){var all=scoped().slice().sort(function(a,b){return sortMode==="ta"?taScore(b)-taScore(a):num(b[curPeriod])-num(a[curPeriod]);});var periodLabel=PERIODS.filter(function(p){return p[1]===curPeriod;})[0][0];$q("#bu-sub").textContent=sortMode==="ret"?periodLabel+" 수익률 순 · 재무는 각 종목 아래 최근 8개 분기·5년 연간 표시":"기술점수(0~100) 상위 · 카드 클릭 = 상세";$q("#bottomup-content").innerHTML=sortMode==="ret"?returnTable(all):'<div class="grid" id="bottomup-board" style="grid-template-columns:repeat(auto-fill,minmax(158px,1fr))">'+all.slice(0,SHOWN).map(function(s,i){return bottomUpCard(s,i+1);}).join("")+"</div>";$q("#bu-more").style.display=all.length>SHOWN?"":"none";$qa(".bu-main-row, #bottomup-board .stock-card").forEach(function(el){el.onclick=function(){openStockModal(el.dataset.t);};});syncTableHeaderOffset();activateFills();}
function openStockModal(ticker){var s=(DATA.stocks||[]).filter(function(x){return x.ticker===ticker;})[0];if(!s)return;var chips=[{label:"1주",value:fmtPct(s.r1w),cls:pctClass(s.r1w)},{label:"1개월",value:fmtPct(s.r1m),cls:pctClass(s.r1m)},{label:"3개월",value:fmtPct(s.r3m),cls:pctClass(s.r3m)},{label:"YTD",value:fmtPct(s.ytd),cls:pctClass(s.ytd)},{label:"52주고점대비",value:fmtPct(s.from_high,1),cls:pctClass(s.from_high)}];if(s.mcap_usd)chips.push({label:"시총",value:fmtMcap(s.mcap_usd),cls:""});var profile=PROFILES[ticker];openStatModal({name:s.name,sub:s.ticker.replace(/\.[A-Z]+$/,"")+" · "+s.sector+(s.rank?" · 시총 "+s.rank+"위":""),price:s.price,priceCcy:ccyOf(s.ticker),r1d:s.r1d,chips:chips,intro:profile?profile.biz:"회사 개요가 아직 준비되지 않았습니다.",candles:s.candles,news:s.news,financials:FIN[ticker],ta:taOf(s),tk:s.ticker});}
$q("#bu-more").addEventListener("click",function(){SHOWN+=30;renderBottomUp();});
Promise.all([fetchJSON("megacap.json"),fetchJSON("megacap_profiles.json").catch(function(){return null;}),fetchJSON("financials.json").catch(function(){return null;})]).then(function(rs){DATA=rs[0];PROFILES=(rs[1]&&rs[1].profiles)||{};FIN=(rs[2]&&rs[2].financials)||{};var uni=DATA.universe_updated?" · 명단 "+DATA.universe_updated.slice(0,10)+" 기준(주 1회)":"";$q("#updated").textContent="시세 "+(DATA.updated||"-")+" · "+DATA.count+"종목"+uni;renderToggle();renderBottomUp();}).catch(function(err){$q("#bottomup-content").innerHTML='<div class="empty">megacap.json 로드 실패 — fetch_megacap.py를 실행하세요<br><span class="small">'+escapeHtml(err.message)+"</span></div>";});
</script>
</body>
</html>
