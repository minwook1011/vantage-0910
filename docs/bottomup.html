<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>Bottom-up 종목 발굴 — VANTAGE</title>
<link rel="stylesheet" href="theme.css?v=20260909b">
<style>
/* ── 레이아웃 ─────────────────────────────── */
.bu-lede { color:var(--muted); font-size:13px; line-height:1.7; margin:4px 0 0; }
.bu-lede b { color:var(--text); }
.bu-bar { position:sticky; top:86px; z-index:45; margin:16px -16px 0; padding:10px 16px; background:rgba(11,14,20,.94); backdrop-filter:blur(13px); border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
.bu-bar-in { max-width:1280px; margin:0 auto; display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; }
.bu-search { flex:1 1 200px; min-width:160px; max-width:280px; display:flex; align-items:center; gap:7px; background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:0 10px; }
.bu-search:focus-within { border-color:var(--accent); }
.bu-search input { flex:1; min-width:0; background:none; border:0; outline:0; color:var(--text); font:13px var(--sans); padding:8px 0; }
.bu-search span { color:var(--faint); font-size:13px; }
.bu-opt { display:flex; align-items:center; gap:7px; }
.bu-opt .lbl { color:var(--muted); font-size:11.5px; white-space:nowrap; }
.bu-sec { margin-top:22px; }
.bu-sec-h { display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
.bu-sec-h h2 { margin:0; font-size:16px; }
.bu-sec-h .hint { color:var(--muted); font-size:12px; }

/* ── 요약 숫자 ─────────────────────────────── */
.bu-pulse { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-top:18px; }
.pulse-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; }
.pulse-card .k { color:var(--muted); font-size:11.5px; }
.pulse-card .v { font:800 24px var(--mono); margin-top:3px; font-variant-numeric:tabular-nums; }
.pulse-card .s { color:var(--faint); font-size:11px; margin-top:2px; }
.breadth { height:6px; border-radius:3px; background:rgba(61,126,255,.55); overflow:hidden; margin-top:7px; }
.breadth i { display:block; height:100%; background:var(--up); width:0; transition:width .9s cubic-bezier(.16,1,.3,1); }

/* ── 전략 프리셋 ─────────────────────────────── */
.presets { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:thin; }
.preset { flex:0 0 auto; text-align:left; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:9px 13px; cursor:pointer; color:var(--text); font-family:inherit; min-width:128px; transition:border-color .15s, background .15s, transform .12s; }
.preset:hover { border-color:rgba(103,136,216,.75); transform:translateY(-1px); }
.preset.on { border-color:var(--accent); background:linear-gradient(180deg,rgba(91,140,255,.18),rgba(91,140,255,.05)); }
.preset .p-t { font-weight:800; font-size:13px; white-space:nowrap; }
.preset .p-c { font:700 11px var(--mono); color:var(--accent); margin-left:5px; }
.preset .p-d { display:block; color:var(--muted); font-size:11px; margin-top:3px; white-space:nowrap; }
.preset-why { margin-top:8px; font-size:12px; color:var(--muted); min-height:18px; }
.preset-why b { color:var(--text); }

/* ── 섹터 온도 ─────────────────────────────── */
.sectors { display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:7px; }
.sec-tile { position:relative; overflow:hidden; text-align:left; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:9px 11px; cursor:pointer; color:var(--text); font-family:inherit; transition:border-color .15s, opacity .2s; }
.sec-tile::before { content:""; position:absolute; left:0; bottom:0; top:0; width:var(--w,0%); background:var(--heat); opacity:.5; transition:width .8s cubic-bezier(.16,1,.3,1); }
.sec-tile > * { position:relative; }
.sec-tile:hover { border-color:rgba(103,136,216,.75); }
.sec-tile.on { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
.sectors.has-on .sec-tile:not(.on) { opacity:.45; }
.sec-tile .n { font-size:12px; font-weight:750; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sec-tile .r { font:800 15px var(--mono); margin-top:2px; }
.sec-tile .c { color:var(--muted); font-size:10.5px; }
.sec-tile .crown { position:absolute; right:8px; top:7px; font-size:11px; }

/* ── 지도 ─────────────────────────────── */
.map-wrap { position:relative; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:8px 8px 4px; }
.map-wrap svg { display:block; width:100%; height:auto; }
.map-wrap .q-bg { opacity:.05; }
.map-wrap .q-lbl { font:800 13px var(--sans); fill:var(--text); opacity:.75; }
.map-wrap .q-sub { font:11px var(--sans); fill:var(--muted); }
.map-wrap .q-cnt { font:800 12px var(--mono); fill:var(--accent); }
.map-wrap .axis { stroke:var(--border-strong); stroke-width:1; }
.map-wrap .zero { stroke:#4a5672; stroke-dasharray:4 4; }
.map-wrap .tick { font:10.5px var(--mono); fill:var(--faint); }
.dot { cursor:pointer; transition:transform .7s cubic-bezier(.16,1,.3,1), opacity .3s, r .3s; stroke:rgba(0,0,0,.35); stroke-width:1; }
.dot.dim { opacity:.1; pointer-events:none; }
.dot.hot { stroke:#fff; stroke-width:2.2; }
.dot-lbl { font:700 10.5px var(--sans); fill:var(--text); pointer-events:none; transition:transform .7s cubic-bezier(.16,1,.3,1), opacity .3s; paint-order:stroke; stroke:rgba(11,14,20,.85); stroke-width:3px; }
.map-tip { position:absolute; pointer-events:none; z-index:5; background:rgba(16,20,29,.97); border:1px solid var(--border-strong); border-radius:8px; padding:8px 10px; font-size:12px; min-width:170px; box-shadow:0 10px 24px rgba(0,0,0,.4); opacity:0; transform:translateY(4px); transition:opacity .12s, transform .12s; }
.map-tip.show { opacity:1; transform:none; }
.map-tip b { font-size:13px; }
.map-tip .row { display:flex; justify-content:space-between; gap:12px; font-family:var(--mono); margin-top:3px; color:var(--muted); }
.map-tip .row span:last-child { color:var(--text); }
.map-legend { display:flex; gap:14px; flex-wrap:wrap; color:var(--muted); font-size:11.5px; padding:6px 6px 4px; }
.map-legend i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:-1px; }

/* ── 순위 리스트 ─────────────────────────────── */
.list-tools { display:flex; gap:8px 14px; flex-wrap:wrap; align-items:center; }
.rank-list { display:flex; flex-direction:column; gap:7px; }
.rk, .rk-head { grid-template-columns:44px minmax(150px,1.35fr) 104px minmax(120px,1fr) 64px minmax(150px,1.2fr) minmax(170px,1.3fr); }
.rk { display:grid; align-items:center; gap:14px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 14px; cursor:pointer; transition:border-color .15s, background .15s, transform .15s; opacity:0; transform:translateY(8px); animation:rkIn .45s cubic-bezier(.16,1,.3,1) forwards; animation-delay:var(--d,0ms); }
@keyframes rkIn { to { opacity:1; transform:none; } }
.rk:hover { border-color:rgba(103,136,216,.8); background:var(--card-hover); }
.rk-no { font:800 16px var(--mono); color:var(--faint); text-align:center; }
.rk-no.top { color:var(--gold); }
.rk-name b { display:block; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rk-name span { display:block; color:var(--muted); font:11.5px var(--mono); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rk-spark svg { display:block; width:104px; height:34px; }
.rk-ret .big { font:800 17px var(--mono); font-variant-numeric:tabular-nums; }
.rk-ret .bar { position:relative; height:5px; background:var(--bg2); border-radius:3px; margin-top:5px; overflow:hidden; }
.rk-ret .bar i { position:absolute; top:0; bottom:0; left:50%; width:0; transition:width .8s cubic-bezier(.16,1,.3,1), left .8s cubic-bezier(.16,1,.3,1); }
.rk-ret .sub { color:var(--faint); font:10.5px var(--mono); margin-top:4px; white-space:nowrap; }
.ring { position:relative; width:52px; height:52px; }
.ring svg { transform:rotate(-90deg); }
.ring .trk { stroke:var(--bg2); }
.ring .val { transition:stroke-dashoffset 1s cubic-bezier(.16,1,.3,1); }
.ring b { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font:800 14px var(--mono); }
.ring small { position:absolute; left:0; right:0; bottom:-13px; text-align:center; color:var(--faint); font-size:9.5px; }
.sigs { display:flex; flex-wrap:wrap; gap:4px; }
.sig { font-size:11px; font-weight:700; padding:2px 7px; border-radius:4px; white-space:nowrap; border:1px solid; }
.sig.g { color:#ff8b98; border-color:rgba(240,71,90,.45); background:rgba(240,71,90,.1); }
.sig.b { color:#8fb2ff; border-color:rgba(61,126,255,.45); background:rgba(61,126,255,.1); }
.sig.y { color:#f5c451; border-color:rgba(240,180,41,.45); background:rgba(240,180,41,.08); }
.sig.n { color:var(--muted); border-color:var(--border-strong); }
/* 실적(금색)과 주가(빨강·파랑)는 색 계열과 구획선으로 분리한다 */
.fin { display:flex; flex-direction:column; gap:3px; border-left:1px dashed var(--border-strong); padding-left:12px; }
.fin-tag { flex:0 0 auto; color:#f0b429; border:1px solid rgba(240,180,41,.4); background:rgba(240,180,41,.08); border-radius:3px; padding:0 4px; font-size:9.5px; font-weight:800; letter-spacing:.04em; }
.fin-cap .fin-up { color:#f0b429; } .fin-cap .fin-dn { color:#94a1bd; }
/* 컬럼 이름 줄은 스크롤해도 상단 컨트롤 바 바로 아래에 고정 */
.rk-head { display:grid; align-items:end; gap:14px; position:sticky; top:calc(86px + var(--bar-h,58px)); z-index:30; margin:0 -6px; padding:9px 20px 7px; background:rgba(11,14,20,.95); backdrop-filter:blur(10px); border-bottom:1px solid var(--border-strong); box-shadow:0 8px 14px rgba(0,0,0,.28); color:var(--faint); font-size:10.5px; font-weight:700; letter-spacing:.04em; }
.rk-head .h-price { color:#8e9bb5; } .rk-head .h-fin { color:#b99534; }
.fin-bars { display:flex; align-items:flex-end; gap:3px; height:34px; position:relative; }
.fin-bars .b { flex:1; min-width:6px; border-radius:2px 2px 0 0; transform-origin:bottom; transform:scaleY(0); transition:transform .7s cubic-bezier(.16,1,.3,1); transition-delay:var(--d,0ms); }
.fin-bars.go .b { transform:scaleY(1); }
.fin-cap { display:flex; justify-content:space-between; gap:6px; font:10.5px var(--mono); color:var(--faint); white-space:nowrap; }
.fin-cap .y { font-weight:700; }
.fin-none { color:var(--faint); font-size:11px; }
.more-btn { display:block; width:100%; margin-top:10px; background:var(--card); border:1px dashed var(--border-strong); color:var(--muted); border-radius:10px; padding:10px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit; }
.more-btn:hover { border-color:var(--accent); color:var(--text); }
.empty-note { padding:30px; text-align:center; color:var(--muted); background:var(--card); border:1px solid var(--border); border-radius:10px; }
.up { color:#ff7a8c; } .dn { color:#76a4ff; }

@media (max-width:1100px) {
  .rk, .rk-head { grid-template-columns:40px minmax(130px,1.4fr) 96px minmax(110px,1fr) 58px minmax(160px,1.4fr); }
  .rk .sigs, .rk-head .h-sig { display:none; }
}
@media (max-width:760px) {
  .bu-bar { margin-left:-10px; margin-right:-10px; padding-left:10px; padding-right:10px; }
  .bu-search { max-width:none; flex-basis:100%; }
  .bu-pulse { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .pulse-card .v { font-size:20px; }
  .rk { grid-template-columns:30px minmax(0,1fr) auto 52px; grid-template-areas:"no name ret ring" "no spark fin fin" "no sig sig sig"; gap:8px 10px; padding:11px 12px; }
  .rk .sigs { display:flex; grid-area:sig; }
  .rk-no { grid-area:no; align-self:start; font-size:14px; }
  .rk-name { grid-area:name; min-width:0; } .rk-ret { grid-area:ret; text-align:right; } .rk-ret .bar, .rk-ret .sub { display:none; }
  .rk-ring { grid-area:ring; } .rk-spark { grid-area:spark; } .rk .fin { grid-area:fin; }
  .rk-spark svg { width:88px; }
  .rk-head { display:none; }
  .rk .fin { border-left:0; padding-left:0; border-top:1px dashed var(--border-strong); padding-top:6px; }
}
</style>
</head>
<body>
<header id="topnav"></header>
<div class="container">
  <div class="kicker">Bottom-up 접근 · 종목 발굴</div>
  <div class="page-head"><h1>Bottom-up 종목 발굴</h1><span class="upd" id="updated"></span></div>
  <p class="bu-lede">① <b>전략</b>을 고르고 → ② <b>섹터</b>로 좁히고 → ③ <b>지도</b>에서 위치를 보고 → ④ <b>순위</b>에서 종목을 누르면 차트·재무 상세가 열립니다.</p>
  <div class="bu-pulse" id="pulse"></div>
</div>

<div class="bu-bar">
  <div class="bu-bar-in">
    <label class="bu-search"><span>🔍</span><input id="q" type="search" placeholder="종목명·티커 검색" autocomplete="off"></label>
    <div class="bu-opt"><span class="lbl">수익률 기간</span><div class="toggle" id="period-toggle"></div></div>
    <div class="bu-opt"><span class="lbl">범위</span><div class="toggle" id="universe-toggle"></div></div>
  </div>
</div>

<div class="container">
  <section class="bu-sec">
    <div class="bu-sec-h"><h2>① 어떤 종목을 찾나요?</h2><span class="hint">카드를 누르면 지도·순위가 바로 바뀝니다</span></div>
    <div class="presets" id="presets"></div>
    <div class="preset-why" id="preset-why"></div>
  </section>

  <section class="bu-sec">
    <div class="bu-sec-h"><h2>② 섹터 온도</h2><span class="hint" id="sector-hint">기간 수익률 중앙값 · 누르면 해당 섹터만</span></div>
    <div class="sectors" id="sectors"></div>
  </section>

  <section class="bu-sec">
    <div class="bu-sec-h"><h2>③ 모멘텀 × 추세 지도</h2><span class="hint">가로 = 기간 수익률 · 세로 = 기술점수 · 원 크기 = 시가총액</span></div>
    <div class="map-wrap" id="map-wrap"><div class="spin">로딩 중…</div></div>
  </section>

  <section class="bu-sec">
    <div class="bu-sec-h">
      <h2>④ 순위 <span class="hint" id="list-sub"></span></h2>
      <div class="list-tools">
        <div class="bu-opt"><span class="lbl">정렬</span><div class="toggle" id="sort-toggle"></div></div>
        <div class="bu-opt"><span class="lbl">재무</span><div class="toggle" id="fin-toggle"></div></div>
      </div>
    </div>
    <div id="list"><div class="spin">로딩 중…</div></div>
    <button class="more-btn" id="more" style="display:none"></button>
  </section>
</div>
<div class="modal-back" id="modal-back-holder" style="display:none"></div>

<script>
(function () {
  "use strict";
  var DATA = null, PROFILES = {}, FIN = {}, TA = {}, ALL = [];
  var PERIODS = [["1W","r1w"],["1M","r1m"],["3M","r3m"],["YTD","ytd"]];
  var SORTS = [["수익률","ret"],["기술점수","ta"],["거래량↑","vol"],["고점근접","high"]];
  var FINS = [["매출·연간","rev|annual"],["매출·분기","rev|quarterly"],["영업익·연간","op|annual"],["영업익·분기","op|quarterly"]];
  var UNIVERSES = [100, 300], PAGE = 25;
  var view = { period:"r1m", sort:"ret", fin:"rev|annual", preset:"all", sector:null, q:"", n:300, shown:PAGE };
  try { var sv = JSON.parse(localStorage.getItem("bu-view-v2") || "null"); if (sv) ["period","sort","fin","preset"].forEach(function (k) { if (sv[k]) view[k] = sv[k]; }); } catch (e) {}
  try { var savedN = parseInt(localStorage.getItem("megacapN"), 10); if (UNIVERSES.indexOf(savedN) >= 0) view.n = savedN; } catch (e) {}
  function persist() { try { localStorage.setItem("bu-view-v2", JSON.stringify({ period:view.period, sort:view.sort, fin:view.fin, preset:view.preset })); } catch (e) {} }

  /* ── 기술 신호 해석 ───────────────────── */
  function taOf(s) { if (!(s.ticker in TA)) TA[s.ticker] = computeTA(s.candles) || null; return TA[s.ticker]; }
  function sub(s, key) { var t = taOf(s); if (!t) return null; for (var i = 0; i < t.subs.length; i++) if (t.subs[i].key === key) return t.subs[i]; return null; }
  function detail(s, key) { var x = sub(s, key); return x ? String(x.detail || "") : ""; }
  function score(s) { var t = taOf(s); return t ? t.score : null; }
  function signals(s) {
    var out = [], ma = detail(s,"ma"), brk = detail(s,"brk"), macd = detail(s,"macd"), ichi = detail(s,"ichi"), rsi = parseFloat(detail(s,"rsi"));
    if (/돌파/.test(brk)) out.push(["g","🚀 " + brk.replace(/\(.*?\)/g,"").trim()]);
    if (num(s.from_high) >= -3) out.push(["g","신고가 근접"]);
    if (ma === "완전 정배열") out.push(["g","완전 정배열"]);
    if (num(s.vol_ratio) >= 1.3) out.push(["y","거래량 ×" + num(s.vol_ratio).toFixed(1)]);
    if (/골든/.test(macd)) out.push(["g","MACD 골든"]);
    if (isFinite(rsi) && rsi >= 70) out.push(["y","RSI " + Math.round(rsi) + " 과열"]);
    if (isFinite(rsi) && rsi <= 30) out.push(["b","RSI " + Math.round(rsi) + " 과매도"]);
    if (/수축/.test(brk)) out.push(["n","수렴 중"]);
    if (/구름대 위/.test(ichi)) out.push(["n","구름 위"]);
    if (/아래/.test(ichi) && ma === "역배열 성격") out.push(["b","역배열·구름 아래"]);
    return out.slice(0, 4);
  }

  /* ── 전략 프리셋 ───────────────────── */
  var PRESETS = [
    { id:"all", t:"전체", d:"조건 없이 모두", why:"범위 안의 모든 종목입니다.", f:function () { return true; } },
    { id:"lead", t:"🔥 주도주", d:"오르고 + 추세 강함", why:"<b>기간 수익률이 플러스</b>이고 <b>기술점수 65점 이상</b>인 종목. 시장을 끌고 가는 쪽입니다.",
      f:function (s) { return num(s[view.period]) > 0 && score(s) >= 65; } },
    { id:"pull", t:"🎯 눌림목", d:"추세 속 쉬어가기", why:"<b>3개월 +10% 이상</b> 오른 추세 종목이 <b>최근 1주 하락·횡보</b> 중이고 이평선이 <b>역배열이 아님</b>. 추세 재개 전 매수 후보입니다.",
      f:function (s) { return num(s.r3m) >= 10 && num(s.r1w) <= 0.5 && detail(s,"ma") !== "역배열 성격"; } },
    { id:"brk", t:"🚀 돌파·신고가", d:"새 가격대 진입", why:"<b>수렴 후 돌파/20일 신고가 돌파</b> 신호가 떴거나 <b>52주 고점 대비 -3% 이내</b>인 종목입니다.",

    return '<div class="rk" data-t="' + s.ticker + '" style="--d:' + Math.min(i % PAGE, 14) * 28 + 'ms">' +
      '<div class="rk-no' + (i < 3 ? " top" : "") + '">' + (i < 3 ? ["🥇","🥈","🥉"][i] : i + 1) + "</div>" +
      '<div class="rk-name"><b>' + escapeHtml(s.name) + "</b><span>" + bare(s.ticker) + " · " + escapeHtml(s.sector) + " · " + fmtMcap(s.mcap_usd) + "</span></div>" +
      '<div class="rk-spark">' + sparklineSVG(s.spark, 104, 34) + "</div>" +
      '<div class="rk-ret"><div class="big ' + pc(ret) + '">' + fmtPct(ret) + '</div><div class="bar"><i data-w="' + w.toFixed(1) + '" data-neg="' + (ret < 0 ? 1 : 0) + '" style="background:' + (ret >= 0 ? "var(--up)" : "var(--dn)") + '"></i></div><div class="sub">' + others + "</div></div>" +
      '<div class="rk-ring">' + ring(score(s)) + "</div>" +
      '<div class="sigs">' + sig + "</div>" + finBars(s) + "</div>";
  }
  function renderList() {
    var list = sorted(filtered()), shown = list.slice(0, view.shown);
    var maxRet = Math.max.apply(null, shown.map(function (s) { return Math.abs(num(s[view.period])); }).concat([1]));
    var sortLabel = SORTS.filter(function (x) { return x[1] === view.sort; })[0][0];
    $q("#list-sub").textContent = "· " + list.length + "종목 · " + (view.sort === "ret" ? periodLabel() + " " : "") + sortLabel + " 순";
    var head = '<div class="rk-head"><span>#</span><span>종목 · 섹터 · 시총</span><span class="h-price">60일 주가</span><span class="h-price">' + periodLabel() + ' 수익률</span><span>기술점수</span><span class="h-sig">신호</span><span class="h-fin">실적 · ' + FINS.filter(function (x) { return x[1] === view.fin; })[0][0] + "</span></div>";
    $q("#list").innerHTML = shown.length ? head + '<div class="rank-list">' + shown.map(function (s, i) { return row(s, i, maxRet); }).join("") + "</div>"
      : '<div class="empty-note">조건에 맞는 종목이 없습니다. 전략이나 섹터를 바꿔보세요.</div>';
    var more = $q("#more");
    more.style.display = list.length > view.shown ? "" : "none";
    more.textContent = "더 보기 (" + Math.min(PAGE, list.length - view.shown) + "종목 · 남은 " + (list.length - view.shown) + ")";
    $qa("#list .rk").forEach(function (el) {
      el.onclick = function () { openStockModal(el.dataset.t); };
      el.onmouseenter = function () { var d = $q('#m-dots .dot[data-t="' + el.dataset.t + '"]'); if (d) d.classList.add("hot"); };
      el.onmouseleave = function () { var d = $q('#m-dots .dot[data-t="' + el.dataset.t + '"]'); if (d) d.classList.remove("hot"); };
    });
    animateIn();
  }
  function animateIn() {
    var els = $qa("#list .rk:not(.seen)");
    function go(el) {
      el.classList.add("seen");
      var bar = el.querySelector(".rk-ret .bar i"); if (bar) { var w = +bar.dataset.w; bar.style.width = w + "%"; bar.style.left = bar.dataset.neg === "1" ? (50 - w) + "%" : "50%"; }
      var v = el.querySelector(".ring .val"); if (v) v.style.strokeDashoffset = v.dataset.off;
      var fb = el.querySelector(".fin-bars"); if (fb) fb.classList.add("go");
    }
    if (!("IntersectionObserver" in window)) { els.forEach(go); return; }
    var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { setTimeout(function () { go(e.target); }, 120); io.unobserve(e.target); } }); }, { threshold:.15 });
    els.forEach(function (el) { io.observe(el); });
  }

  /* ── 컨트롤 ───────────────────── */
  function renderControls() {
    $q("#period-toggle").innerHTML = toggleHTML(PERIODS, view.period, "k");
    $q("#universe-toggle").innerHTML = toggleHTML(UNIVERSES.map(function (n) { return ["TOP " + n, String(n)]; }), String(view.n), "n");
    $q("#sort-toggle").innerHTML = toggleHTML(SORTS, view.sort, "s");
    $q("#fin-toggle").innerHTML = toggleHTML(FINS, view.fin, "f");
    $qa("#period-toggle button").forEach(function (b) { b.onclick = function () { view.period = b.dataset.k; persist(); renderAll(); }; });
    $qa("#universe-toggle button").forEach(function (b) { b.onclick = function () { view.n = +b.dataset.n; try { localStorage.setItem("megacapN", view.n); } catch (e) {} view.shown = PAGE; renderAll(); }; });
    $qa("#sort-toggle button").forEach(function (b) { b.onclick = function () { view.sort = b.dataset.s; view.shown = PAGE; persist(); renderControls(); renderList(); }; });
    $qa("#fin-toggle button").forEach(function (b) { b.onclick = function () { view.fin = b.dataset.f; persist(); renderControls(); renderList(); }; });
  }
  /* 컬럼 이름 줄을 고정할 위치 = 상단 컨트롤 바 높이 (줄바꿈되면 높이가 달라진다) */
  function syncBarHeight() { var bar = $q(".bu-bar"); if (bar) document.documentElement.style.setProperty("--bar-h", bar.offsetHeight + "px"); }
  function renderAll() { renderControls(); renderPulse(); renderPresets(); renderSectors(); renderMap(); renderList(); syncBarHeight(); }

  function openStockModal(ticker) {
    var s = BYT[ticker]; if (!s) return;
    var chips = [{label:"1주",value:fmtPct(s.r1w),cls:pctClass(s.r1w)},{label:"1개월",value:fmtPct(s.r1m),cls:pctClass(s.r1m)},{label:"3개월",value:fmtPct(s.r3m),cls:pctClass(s.r3m)},{label:"YTD",value:fmtPct(s.ytd),cls:pctClass(s.ytd)},{label:"52주고점대비",value:fmtPct(s.from_high,1),cls:pctClass(s.from_high)}];
    if (s.mcap_usd) chips.push({label:"시총",value:fmtMcap(s.mcap_usd),cls:""});
    var profile = PROFILES[ticker];
    openStatModal({ name:s.name, sub:bare(s.ticker) + " · " + s.sector + (s.rank ? " · 시총 " + s.rank + "위" : ""), price:s.price, priceCcy:ccyOf(s.ticker), r1d:s.r1d, chips:chips,
      intro:profile ? profile.biz : "회사 개요가 아직 준비되지 않았습니다.", candles:s.candles, news:s.news, financials:FIN[ticker], ta:taOf(s), tk:s.ticker });
  }

  var qTimer = null;
  $q("#q").addEventListener("input", function (e) { clearTimeout(qTimer); qTimer = setTimeout(function () { view.q = e.target.value.trim(); view.shown = PAGE; renderPulse(); renderPresets(); renderSectors(); renderMap(); renderList(); }, 160); });
  $q("#more").addEventListener("click", function () { view.shown += PAGE; renderList(); });
  var rsTimer = null, lastW = 0;
  window.addEventListener("resize", function () {
    if ($q("#tip")) $q("#tip").classList.remove("show");
    syncBarHeight();
    clearTimeout(rsTimer);
    rsTimer = setTimeout(function () { var w = $q("#map-wrap").clientWidth; if (DATA && Math.abs(w - lastW) > 40) { lastW = w; mapBuilt = false; renderMap(); } }, 200);
  });

  Promise.all([fetchJSON("megacap.json"), fetchJSON("megacap_profiles.json").catch(function () { return null; }), fetchJSON("financials.json").catch(function () { return null; })]).then(function (rs) {
    DATA = rs[0]; PROFILES = (rs[1] && rs[1].profiles) || {}; FIN = (rs[2] && rs[2].financials) || {};
    ALL = DATA.stocks || []; ALL.forEach(function (s) { BYT[s.ticker] = s; });
    var uni = DATA.universe_updated ? " · 명단 " + DATA.universe_updated.slice(0, 10) + " 기준(주 1회)" : "";
    $q("#updated").textContent = "시세 " + (DATA.updated || "-") + " · " + DATA.count + "종목" + uni;
    renderAll();
  }).catch(function (err) {
    $q("#list").innerHTML = '<div class="empty-note">megacap.json 로드 실패 — fetch_megacap.py를 실행하세요<br><span class="small">' + escapeHtml(err.message) + "</span></div>";
    $q("#map-wrap").innerHTML = "";
  });
})();
</script>
</body>
</html>
