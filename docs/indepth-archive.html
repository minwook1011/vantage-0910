<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="firebase-sync.js?v=20261004K"></script>
<script src="gate.js?v=20261003L"></script>
<meta name="theme-color" content="#070a11">
<title>인뎁스 아카이브 — 100억</title>
<link rel="stylesheet" href="theme.css?v=20261004B">
<link rel="stylesheet" href="archive.css?v=20261025A">
</head>
<body data-archive-src="indepth-archive-data.json">
<header id="topnav"></header>
<main class="container archive-page">
  <section class="archive-hero">
    <div>
      <div class="kicker">인뎁스 아카이브</div>
      <h1>한 번 판 리서치는,<br><em>다시 꺼내 본다.</em></h1>
      <p>산업 흐름 판정과 기업 인뎁스 리포트를 날짜순으로 쌓아 둡니다. 카드를 누르면 리포트 전문이 열립니다.</p>
    </div>
    <div class="archive-stats" aria-label="아카이브 통계">
      <div><b id="archive-count">0</b><span>REPORTS</span></div>
      <div><b id="archive-category-count">0</b><span>CATEGORIES</span></div>
      <div><b id="archive-latest">—</b><span>LATEST</span></div>
    </div>
  </section>

  <section class="archive-console" aria-label="인뎁스 검색과 분류">
    <label class="archive-search"><span>⌕</span><input id="archive-search" type="search" autocomplete="off" placeholder="기업 · 산업 · 판정 · 태그 검색"></label>
    <div class="archive-filters" id="archive-filters" role="group" aria-label="분류 필터">
      <button class="on" type="button" data-category="전체">전체</button>
      <button type="button" data-category="산업 흐름">산업 흐름</button>
      <button type="button" data-category="기업 인뎁스">기업 인뎁스</button>
    </div>
  </section>

  <section class="archive-library" aria-labelledby="library-title">
    <div class="library-head"><div><span>LIBRARY</span><h2 id="library-title">인뎁스 리포트</h2></div><b id="archive-visible-count">0개</b></div>
    <div id="archive-list" class="archive-list" aria-live="polite"></div>
  </section>
</main>
<script src="theme.js?v=20261025A"></script>
<script src="archive.js?v=20261025A"></script>
</body>
</html>
