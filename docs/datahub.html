<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="firebase-sync.js?v=20260923a"></script>
<script src="gate.js?v=20260909a"></script>
<title>데이터 허브 — VANTAGE</title>
<link rel="stylesheet" href="theme.css?v=20260909b">
<link rel="stylesheet" href="datahub.css?v=20260910a">
<link rel="stylesheet" href="datahub-search.css?v=20260910b">
<link rel="stylesheet" href="finemtec.css?v=20260912c">
<link rel="stylesheet" href="memory-data.css?v=20260912c">
<link rel="stylesheet" href="ai-indicators.css?v=20260923b">
<link rel="stylesheet" href="company-bench.css?v=20260923h">
</head>
<body>
<header id="topnav"></header>
<main class="container datahub-page">
  <div class="data-head">
    <div><div class="kicker">PERSONAL DATA NETWORK</div><h1>데이터 허브</h1><p>AI 인프라, 수출입, 기업별 데이터를 나눠서 봅니다.</p></div>
    <button class="data-add-btn" id="open-onboarding">+ 데이터 연결 설계</button>
  </div>

  <nav class="dh-views" id="dh-views" aria-label="데이터 모음 선택">
    <button type="button" data-view="ai"><b>AI 관련 데이터 모음</b><small>토큰 · 가격 · GPU · TSMC · 메모리 · 캐팩스</small></button>
    <button type="button" data-view="trade"><b>수출입 데이터 모음</b><small>TRASS 순별 수출 · 메모리 가격</small></button>
    <button type="button" data-view="company"><b>기업별 데이터 모음</b><small>기업 선택 · 주가 × 실적 × 지표</small></button>
  </nav>

  <div class="dh-view" data-view-panel="ai">
    <section id="ai-workspace" class="ai-workspace" aria-label="AI 관련 데이터 모음"></section>
  </div>

  <div class="dh-view" data-view-panel="trade" hidden>
    <section id="trass-workspace" aria-label="TRASS 순별 수출"></section>
    <section id="memory-workspace" class="md-workspace" aria-label="메모리 가격과 한국 수출 데이터"></section>
  </div>

  <div class="dh-view" data-view-panel="company" hidden>
    <section class="workbench cb-bench" aria-label="기업별 데이터 모음">
      <div class="workbench-head"><div><div class="kicker">COMPANY WORKBENCH</div><h2>기업별 데이터 모음</h2></div><span id="workbench-status">기업을 선택해 주세요</span></div>
      <div class="cb-chips" id="cb-chips" role="group" aria-label="기업 선택"></div>
      <section id="company-bench" class="fm-workspace cb-workspace" aria-label="선택한 기업의 주가·실적·관련 지표 비교"></section>
      <section id="finemtec-workspace" class="fm-workspace" aria-label="파인엠텍 주가·실적·납품 비교" hidden></section>
      <section id="zeta-workspace" class="fm-workspace cb-workspace" aria-label="스캐터랩 제타 트래픽 대리 지표" hidden></section>
    </section>
  </div>

  <section class="onboarding" id="onboarding" hidden>
    <div><div class="kicker">NEXT INPUT</div><h2>다음 데이터는 이렇게만 알려줘</h2><p>데이터 이름, 분류, 출처 링크만 주면 수집 주기·단위·기업 연결까지 이 허브에 붙일 수 있어.</p></div>
    <div class="input-guide"><span>01 <b>무슨 데이터?</b> 예: TSMC 월매출</span><span>02 <b>어느 분류?</b> 예: 섹터</span><span>03 <b>출처는?</b> 예: 공식 IR 링크</span></div>
  </section>
</main>
<script>
/* 데이터 허브 3분할 탭 — 주소 #ai / #trade / #company 로 기억한다. 숨겨진 패널은 폭이 0이라 열릴 때 다시 그리도록 알린다. */
(function () {
  var nav = document.getElementById("dh-views"), VIEWS = ["ai", "trade", "company"];
  function show(v, push) {
    if (VIEWS.indexOf(v) < 0) v = "ai";
    nav.querySelectorAll("[data-view]").forEach(function (b) { var on = b.dataset.view === v; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
    document.querySelectorAll("[data-view-panel]").forEach(function (p) { p.hidden = p.dataset.viewPanel !== v; });
    if (push && location.hash !== "#" + v) history.replaceState(null, "", "#" + v);
    document.dispatchEvent(new CustomEvent("vantage-view", {detail: {view: v}}));
    window.dispatchEvent(new Event("resize"));
  }
  nav.querySelectorAll("[data-view]").forEach(function (b) { b.onclick = function () { show(b.dataset.view, true); window.scrollTo({top: 0, behavior: "auto"}); }; });
  window.addEventListener("hashchange", function () { show(location.hash.slice(1), false); });
  show(location.hash.slice(1), false);
})();
</script>

<script src="finemtec-core.js?v=20260912d"></script>
<script src="finemtec.js?v=20260912e"></script>
<script src="memory-data.js?v=20260912d"></script>
<script src="datahub.js?v=20260923a"></script>
<script src="trass-exports.js?v=20260922a"></script>
<script src="ai-indicators.js?v=20260923b"></script>
<script src="zeta.js?v=20260923h"></script>
<script src="company-bench.js?v=20260923c"></script>
</body>
</html>
